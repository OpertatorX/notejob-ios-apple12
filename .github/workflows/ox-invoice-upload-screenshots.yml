name: OX Invoice — upload App Store screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ox-invoice-upload-screenshots.yml"
      - "scripts/fix_ox_final_blockers.cjs"
      - "scripts/render_ox_appstore_ipad_screens.py"

permissions:
  contents: read

jobs:
  upload-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      OX_EAS_PROJECT_ID: "a8ec463b-a530-41c9-af1f-c5499359f881"
      OX_PROJECT_SLUG: "ox-invoice"
      OX_BUNDLE_ID: "com.operatorx.oxinvoice"
      OX_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate App Store screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow >/dev/null
          python3 scripts/render_ox_appstore_screens.py
          python3 scripts/render_ox_appstore_ipad_screens.py

      - name: Install EAS CLI library
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "EXPO_TOKEN missing"; exit 20; }
          mkdir -p /tmp/easlib
          npm install --prefix /tmp/easlib eas-cli@latest --ignore-scripts --no-audit --no-fund >/dev/null

      - name: Upload screenshots and fix final App Store blockers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fix_ox_final_blockers.cjs
