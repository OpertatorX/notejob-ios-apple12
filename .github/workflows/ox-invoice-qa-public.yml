name: OX Invoice QA Public

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ox-invoice-qa-public.yml

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OX Invoice release
        uses: actions/checkout@v4
        with:
          ref: ox-invoice-release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run qa
