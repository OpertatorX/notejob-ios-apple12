name: OX Invoice ASC Subscriptions Read
# diagnostic refresh 2026-09-29 14:24
on:
  push:
    paths:
      - .github/workflows/ox-invoice-asc-subscriptions-read.yml
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_IDENTIFIER: 86PUKZ4ZVC
      ASC_APP_ID: "6817043240"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ox-invoice-release
      - name: Install Python deps
        run: python3 -m pip install --quiet pyjwt cryptography requests
      - name: Audit subscriptions from App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time, sys
          import requests, jwt

          expo_token=os.environ["EXPO_TOKEN"]
          key_identifier=os.environ["ASC_KEY_IDENTIFIER"]
          app_id=os.environ["ASC_APP_ID"]
          gql="https://api.expo.dev/graphql"
          h={"authorization":f"Bearer {expo_token}","content-type":"application/json"}

          q1=r"""
          query Keys($accountName:String!){
            account {
              byName(accountName:$accountName){
                appStoreConnectApiKeysPaginated(first:100){
                  edges { node { id issuerIdentifier keyIdentifier name roles } }
                }
              }
            }
          }
          """
          r=requests.post(gql,headers=h,json={"query":q1,"variables":{"accountName":"operatorx"}},timeout=30)
          r.raise_for_status()
          b=r.json()
          nodes=[e["node"] for e in b["data"]["account"]["byName"]["appStoreConnectApiKeysPaginated"]["edges"]]
          meta=next((x for x in nodes if x.get("keyIdentifier")==key_identifier),None)
          if not meta: raise RuntimeError("EAS ASC key not found")
          print("ASC_ISSUER_ID="+str(meta.get("issuerIdentifier","")))

          q2=r"""
          query Key($id:ID!){
            appStoreConnectApiKey {
              byId(id:$id){ id issuerIdentifier keyIdentifier keyP8 }
            }
          }
          """
          r=requests.post(gql,headers=h,json={"query":q2,"variables":{"id":meta["id"]}},timeout=30)
          r.raise_for_status()
          key=r.json()["data"]["appStoreConnectApiKey"]["byId"]
          now=int(time.time())
          claims={"iat":now,"exp":now+900,"aud":"appstoreconnect-v1"}
          if key.get("issuerIdentifier"): claims["iss"]=key["issuerIdentifier"]
          token=jwt.encode(claims,key["keyP8"],algorithm="ES256",headers={"kid":key_identifier,"typ":"JWT"})
          ah={"Authorization":f"Bearer {token}"}

          def get(path,params=None,allow404=False):
            rr=requests.get("https://api.appstoreconnect.apple.com"+path,headers=ah,params=params,timeout=30)
            if allow404 and rr.status_code==404: return None
            if rr.status_code!=200:
              try:
                errs=rr.json().get("errors",[])
                detail=" | ".join(f"{e.get('code','')}:{e.get('title','')}:{e.get('detail','')}" for e in errs[:3])
              except Exception: detail=rr.text[:300]
              raise RuntimeError(f"GET {path} HTTP {rr.status_code}: {detail}")
            return rr.json()

          bundle=get("/v1/bundleIds",{
            "filter[identifier]":"com.operatorx.oxinvoice",
            "include":"bundleIdCapabilities",
            "fields[bundleIds]":"identifier,name,platform,bundleIdCapabilities",
            "fields[bundleIdCapabilities]":"capabilityType,settings",
            "limit":"10"
          })
          print("BUNDLE_ID_MATCHES="+str(len(bundle.get("data",[]))))
          for b in bundle.get("data",[]):
            print("BUNDLE="+b["id"]+"|"+str(b.get("attributes",{}).get("identifier",""))+"|"+str(b.get("attributes",{}).get("platform","")))
          caps=[x for x in bundle.get("included",[]) if x.get("type")=="bundleIdCapabilities"]
          print("BUNDLE_CAPABILITIES="+",".join(sorted(str(x.get("attributes",{}).get("capabilityType","")) for x in caps)))
          print("IAP_CAPABILITY="+("PRESENT" if any(x.get("attributes",{}).get("capabilityType")=="IN_APP_PURCHASE" for x in caps) else "MISSING"))

          groups=get(f"/v1/apps/{app_id}/subscriptionGroups",{"fields[subscriptionGroups]":"referenceName","limit":"200"}).get("data",[])
          print("GROUP_COUNT="+str(len(groups)))
          for g in groups:
            gid=g["id"]
            print("GROUP="+gid+"|"+str(g.get("attributes",{}).get("referenceName","")))
            glocs=get(f"/v1/subscriptionGroups/{gid}/subscriptionGroupLocalizations",{"limit":"200"}).get("data",[])
            print("GROUP_LOCALES="+",".join(sorted(str(x.get("attributes",{}).get("locale","")) for x in glocs)))

            subs=get(f"/v1/subscriptionGroups/{gid}/subscriptions",{
              "fields[subscriptions]":"name,productId,subscriptionPeriod,groupLevel,state,reviewNote,familySharable",
              "limit":"200"
            }).get("data",[])
            print("SUB_COUNT="+str(len(subs)))
            for s in subs:
              sid=s["id"]; a=s.get("attributes",{})
              print("SUB="+sid+"|"+str(a.get("productId",""))+"|"+str(a.get("subscriptionPeriod",""))+"|level="+str(a.get("groupLevel",""))+"|state="+str(a.get("state","")))
              print("REVIEW_NOTE_PRESENT="+str(bool(str(a.get("reviewNote","")).strip())).lower())

              locs=get(f"/v1/subscriptions/{sid}/subscriptionLocalizations",{"limit":"200"}).get("data",[])
              print("SUB_LOCALES="+",".join(sorted(str(x.get("attributes",{}).get("locale","")) for x in locs)))
              for loc in locs:
                la=loc.get("attributes",{})
                print("LOCALIZATION="+str(la.get("locale",""))+"|name_len="+str(len(str(la.get("name",""))))+"|desc_len="+str(len(str(la.get("description","")))))

              plans=get(f"/v1/subscriptions/{sid}/planAvailabilities",{
                "fields[subscriptionPlanAvailabilities]":"availableInNewTerritories,planType",
                "limit":"200"
              }).get("data",[])
              print("PLAN_COUNT="+str(len(plans)))
              for p in plans:
                pa=p.get("attributes",{})
                print("PLAN="+str(pa.get("planType",""))+"|newTerritories="+str(pa.get("availableInNewTerritories","")))

              prices=get(f"/v1/subscriptions/{sid}/prices",{"filter[planType]":"UPFRONT","limit":"200"}).get("data",[])
              print("PRICE_ROWS="+str(len(prices)))

              shot=get(f"/v1/subscriptions/{sid}/relationships/appStoreReviewScreenshot")
              sd=shot.get("data") if shot else None
              print("REVIEW_SCREENSHOT="+("PRESENT" if sd else "MISSING"))
          PY
