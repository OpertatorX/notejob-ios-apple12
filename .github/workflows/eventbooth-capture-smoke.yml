name: Event Booth RC5 capture

on:
  push:
    branches:
      - eventbooth-asc-internal
    paths:
      - ".github/workflows/eventbooth-capture-smoke.yml"
      - "internal/eventbooth/capture_rc4.sh"
      - "internal/eventbooth/rc4hotfix.py"
      - "internal/eventbooth/rc5.patch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Capture audited RC5
        shell: bash
        run: bash internal/eventbooth/capture_rc4.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EventBooth-RC5-reference-captures
          path: |
            /tmp/ebshots/*.png
            /tmp/ebshots/build.log
          if-no-files-found: warn
          retention-days: 30
