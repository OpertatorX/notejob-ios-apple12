name: Patch OX ASC workflow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-ox-asc-workflow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete availability attribute from direct patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path(".github/workflows/ox-invoice-asc-direct-final.yml")
          s = p.read_text()
          pattern = r"(contentRightsDeclaration: 'DOES_NOT_USE_THIRD_PARTY_CONTENT'),\s*\n\s*availableInNewTerritories: true"
          s2, n = re.subn(pattern, r"\1", s, count=1)
          if n != 1:
              raise SystemExit(f"target block not found or ambiguous: {n}")
          p.write_text(s2)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "OperatorX"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ox-invoice-asc-direct-final.yml
          git commit -m "Fix OX ASC direct content rights patch"
          git push
