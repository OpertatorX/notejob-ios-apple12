name: Event Booth RC8 iPhone Booth validation

on:
  push:
    branches: [eventbooth-asc-internal]
    paths:
      - ".github/workflows/eventbooth-rc8-iphone-booth.yml"
      - "internal/eventbooth/rc8.patch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct RC8
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/eventbooth-src
          rm -rf "$ROOT" /tmp/eb8-dd /tmp/eb8
          mkdir -p "$ROOT" /tmp/eb8
          cat internal/eventbooth/chunks/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/base.tgz
          tar -xzf /tmp/base.tgz -C "$ROOT"
          cp internal/eventbooth/overrides/CameraController.swift "$ROOT/EventBooth/Services/CameraController.swift"
          cat internal/eventbooth/rc2/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/rc2.tgz
          tar -xzf /tmp/rc2.tgz -C "$ROOT"
          cat internal/eventbooth/rc4patch/part*.txt > /tmp/rc4.patch
          (cd "$ROOT" && patch --batch -p1 < /tmp/rc4.patch)
          python3 internal/eventbooth/rc4hotfix.py
          for n in 5 6 7 8; do
            (cd "$ROOT" && patch --batch -p1 < "$GITHUB_WORKSPACE/internal/eventbooth/rc$n.patch")
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/eventbooth-src/project.yml")
          s=p.read_text()
          import re
          s=re.sub(r"CURRENT_PROJECT_VERSION:\s*\d+","CURRENT_PROJECT_VERSION: 10",s)
          p.write_text(s)
          PY
          curl -L --fail --retry 3 --silent --show-error \
            'https://images.unsplash.com/photo-1503738692489-fff01e3e0f3e?auto=format&fit=crop&fm=jpg&q=82&w=2400' \
            -o "$ROOT/EventBooth/Resources/ScreenshotWedding.jpg"

      - name: Build simulator app
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          cd /tmp/eventbooth-src
          xcodegen generate
          set -o pipefail
          xcodebuild -project EventBooth.xcodeproj -scheme EventBooth -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/eb8-dd \
            CODE_SIGNING_ALLOWED=NO build | tee /tmp/eb8/build.log
          if grep -E '/tmp/eventbooth-src/EventBooth/.*: warning:' /tmp/eb8/build.log; then
            echo "SOURCE_WARNING_GATE=FAIL"; exit 31
          fi
          APP="$(find /tmp/eb8-dd/Build/Products -path '*Debug-iphonesimulator/EventBooth.app' -type d -print -quit)"
          test -d "$APP"
          echo "SIM_APP=$APP" >> "$GITHUB_ENV"

      - name: Capture iPhone and iPad Booth
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY' >/tmp/udids.env
          import json
          j=json.load(open('/tmp/devices.json'))
          ds=[d for arr in j['devices'].values() for d in arr if d.get('isAvailable')]
          phones=[d for d in ds if d['name'].startswith('iPhone')]
          pads=[d for d in ds if d['name'].startswith('iPad')]
          def pick(xs,names):
              for n in names:
                  for d in xs:
                      if d['name']==n:return d['udid']
              return xs[0]['udid']
          print('IPHONE='+pick(phones,['iPhone 16 Pro Max','iPhone 16 Pro','iPhone 16 Plus']))
          print('IPAD='+pick(pads,['iPad Pro 13-inch (M4)','iPad Air 13-inch (M3)','iPad Pro 11-inch (M4)']))
          PY
          source /tmp/udids.env

          xcrun simctl boot "$IPHONE" || true
          sleep 16
          xcrun simctl install "$IPHONE" "$SIM_APP"
          for spec in "fr fr_FR iphone-booth-fr.png" "en en_US iphone-booth-en.png"; do
            set -- $spec
            xcrun simctl terminate "$IPHONE" com.operatorx.eventbooth >/dev/null 2>&1 || true
            SIMCTL_CHILD_EVENTBOOTH_SCREEN=booth xcrun simctl launch "$IPHONE" com.operatorx.eventbooth \
              -AppleLanguages "($1)" -AppleLocale "$2" >/dev/null
            sleep 3
            xcrun simctl io "$IPHONE" screenshot "/tmp/eb8/$3"
          done
          xcrun simctl shutdown "$IPHONE" || true

          xcrun simctl boot "$IPAD" || true
          sleep 16
          xcrun simctl install "$IPAD" "$SIM_APP"
          for spec in "fr fr_FR ipad-booth-fr.png" "en en_US ipad-booth-en.png"; do
            set -- $spec
            xcrun simctl terminate "$IPAD" com.operatorx.eventbooth >/dev/null 2>&1 || true
            SIMCTL_CHILD_EVENTBOOTH_SCREEN=booth xcrun simctl launch "$IPAD" com.operatorx.eventbooth \
              -AppleLanguages "($1)" -AppleLocale "$2" >/dev/null
            sleep 3
            xcrun simctl io "$IPAD" screenshot "/tmp/eb8/$3"
          done
          xcrun simctl shutdown "$IPAD" || true

          test "$(find /tmp/eb8 -name '*.png' | wc -l | tr -d ' ')" -eq 4
          sips -g pixelWidth -g pixelHeight /tmp/eb8/*.png
          echo "RC8_RESPONSIVE_CAPTURE=PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EventBooth-RC8-responsive-booth
          path: |
            /tmp/eb8/*.png
            /tmp/eb8/build.log
          if-no-files-found: warn
          retention-days: 30
