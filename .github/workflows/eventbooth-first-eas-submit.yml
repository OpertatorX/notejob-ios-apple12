name: Event Booth first EAS submit

on:
  push:
    branches: [eventbooth-asc-internal]
    paths:
      - ".github/workflows/eventbooth-first-eas-submit.yml"

permissions:
  contents: read
  actions: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      OX_EAS_PROJECT_ID: "a8ec463b-a530-41c9-af1f-c5499359f881"
      OX_PROJECT_SLUG: "ox-invoice"
      OX_BUNDLE_ID: "com.operatorx.oxinvoice"
      EVENTBOOTH_BUNDLE_ID: "com.operatorx.eventbooth"
      EVENTBOOTH_TEAM_ID: "67ZL6VYTQ8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - name: Download signed Event Booth IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/eventbooth-ipa
          gh run download 36871114596 \
            --repo OpertatorX/notejob-ios-apple12 \
            --name EventBooth-IPA-build2 \
            --dir /tmp/eventbooth-ipa
          IPA="$(find /tmp/eventbooth-ipa -name '*.ipa' -print -quit)"
          test -s "$IPA"
          echo "EVENTBOOTH_IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Resolve stored ASC API key
        run: |
          set -euo pipefail
          mkdir -p /tmp/easlib
          npm install --prefix /tmp/easlib eas-cli@latest --ignore-scripts --no-audit --no-fund >/dev/null
          cat >/tmp/resolve-asc.cjs <<'NODE'
          const fs=require('fs');
          const E='/tmp/easlib/node_modules/eas-cli/build';
          const { createGraphqlClient }=require(E+'/commandUtils/context/contextUtils/createGraphqlClient.js');
          const { getOwnerAccountForProjectIdAsync }=require(E+'/project/projectUtils.js');
          const { getAscApiKeyForAppSubmissionsAsync }=require(E+'/credentials/ios/api/GraphqlClient.js');
          const { AppStoreConnectApiKeyQuery }=require(E+'/graphql/queries/AppStoreConnectApiKeyQuery.js');
          (async()=>{
            const gql=createGraphqlClient({accessToken:process.env.EXPO_TOKEN,sessionSecret:null});
            const account=await getOwnerAccountForProjectIdAsync(gql,process.env.OX_EAS_PROJECT_ID);
            const frag=await getAscApiKeyForAppSubmissionsAsync(gql,{
              account,projectName:process.env.OX_PROJECT_SLUG,bundleIdentifier:process.env.OX_BUNDLE_ID
            });
            if(!frag) throw new Error('ASC key missing');
            const key=await AppStoreConnectApiKeyQuery.getByIdAsync(gql,frag.id);
            if(!key?.keyP8||!key?.keyIdentifier||!key?.issuerIdentifier) throw new Error('ASC key incomplete');
            fs.writeFileSync('/tmp/EventBoothAuthKey.p8',key.keyP8,{mode:0o600});
            fs.appendFileSync(process.env.GITHUB_ENV,
              'EVENTBOOTH_ASC_KEY_ID='+key.keyIdentifier+'\nEVENTBOOTH_ASC_ISSUER_ID='+key.issuerIdentifier+'\n');
            console.log('ASC_KEY_READY=yes');
          })().catch(e=>{console.error(e.message);process.exit(1)})
          NODE
          node /tmp/resolve-asc.cjs

      - name: Create/link EAS project for Event Booth
        run: |
          set -euo pipefail
          rm -rf /tmp/eventbooth-eas
          mkdir -p /tmp/eventbooth-eas
          cd /tmp/eventbooth-eas
          cat > app.json <<'JSON'
          {
            "expo": {
              "name": "Event Booth",
              "slug": "eventbooth",
              "owner": "operatorx",
              "version": "1.0.0",
              "ios": {
                "bundleIdentifier": "com.operatorx.eventbooth",
                "buildNumber": "2",
                "supportsTablet": true
              }
            }
          }
          JSON
          cat > package.json <<'JSON'
          {"name":"eventbooth-eas-submit","version":"1.0.0","private":true}
          JSON
          npx --yes eas-cli@latest init --account operatorx --json --non-interactive --force | tee /tmp/eventbooth-eas-init.json
          cat /tmp/eventbooth-eas-init.json

      - name: Configure EAS Submit for first App Store record
        working-directory: /tmp/eventbooth-eas
        run: |
          set -euo pipefail
          cat > eas.json <<JSON
          {
            "cli": { "version": ">= 22.0.0", "appVersionSource": "local" },
            "submit": {
              "production": {
                "ios": {
                  "appleTeamId": "$EVENTBOOTH_TEAM_ID",
                  "sku": "eventbooth-ios-1",
                  "language": "fr-FR",
                  "appName": "Event Booth",
                  "ascApiKeyPath": "/tmp/EventBoothAuthKey.p8",
                  "ascApiKeyId": "$EVENTBOOTH_ASC_KEY_ID",
                  "ascApiKeyIssuerId": "$EVENTBOOTH_ASC_ISSUER_ID"
                }
              }
            }
          }
          JSON
          cat eas.json

      - name: Attempt automatic first submission
        working-directory: /tmp/eventbooth-eas
        shell: bash
        run: |
          set -o pipefail
          npx --yes eas-cli@latest submit \
            --platform ios \
            --profile production \
            --path "$EVENTBOOTH_IPA" \
            --non-interactive \
            --wait \
            --verbose 2>&1 | tee /tmp/eventbooth-first-submit.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EventBooth-first-submit-log
          path: |
            /tmp/eventbooth-first-submit.log
            /tmp/eventbooth-eas-init.json
          if-no-files-found: warn
          retention-days: 7
