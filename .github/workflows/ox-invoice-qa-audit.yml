name: OX Invoice QA Audit
on:
  push:
    paths:
      - .github/workflows/ox-invoice-qa-audit.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ox-invoice-release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        run: npm run test:logic
      - name: OX Invoice audit
        run: npm run audit:oxinvoice
      - name: Expo doctor
        run: npx expo-doctor
