name: OX Invoice BLINK-style iOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_IAPKIT_API_KEY: ${{ secrets.EXPO_PUBLIC_IAPKIT_API_KEY }}
      EXPO_PUBLIC_APP_ENV: production
      EAS_BUILD_NO_EXPO_GO_WARNING: true
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode 26.4.1
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:logic
          npm run audit:oxinvoice
          npx expo-doctor

      - name: Verify production config
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          test -n "${EXPO_PUBLIC_IAPKIT_API_KEY:-}"
          case "$EXPO_PUBLIC_IAPKIT_API_KEY" in
            openiap-kit_pk_*) ;;
            *) echo "Invalid IAPKit publishable key"; exit 22 ;;
          esac
          node -e "const a=require('./app.operatorx.json'); if(a.bundleId!=='com.operatorx.oxinvoice'||a.version!=='1.0'||String(a.build)!=='1') throw new Error('Unexpected OX Invoice release identity'); if(!a.eas?.projectId) throw new Error('EAS project is not linked'); console.log('Release:',a.version,'('+a.build+')',a.bundleId,'EAS',a.eas.projectId)"

      - name: Build signed IPA locally with EAS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          npx eas-cli@latest build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/artifacts/OX-Invoice-1.0-build1.ipa"

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/artifacts/OX-Invoice-1.0-build1.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/artifacts/OX-Invoice-1.0-build1.ipa"
          ls -lh "$GITHUB_WORKSPACE/artifacts/OX-Invoice-1.0-build1.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OX-Invoice-IPA
          path: artifacts/OX-Invoice-1.0-build1.ipa
          if-no-files-found: error
          retention-days: 7
