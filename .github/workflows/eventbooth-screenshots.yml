name: Event Booth RC4 screenshot audit

on:
  push:
    branches: [eventbooth-asc-internal]
    paths: [".github/workflows/eventbooth-screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited RC4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eventbooth-src /tmp/eb-dd /tmp/eb-shots
          mkdir -p /tmp/eventbooth-src /tmp/eb-shots
          cat internal/eventbooth/chunks/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/base.tgz
          echo "8a8d2094865775cdd5f1f6b302d527fbd2fda02008bed437706451fb83ee9cd2  /tmp/base.tgz" | shasum -a 256 -c -
          tar -xzf /tmp/base.tgz -C /tmp/eventbooth-src
          cp internal/eventbooth/overrides/CameraController.swift /tmp/eventbooth-src/EventBooth/Services/CameraController.swift
          cat internal/eventbooth/rc2/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/rc2.tgz
          echo "6ce64b55c2cbaaffcf43b6bf939d4368158ebf28ede0697f01c46e3913161868  /tmp/rc2.tgz" | shasum -a 256 -c -
          tar -xzf /tmp/rc2.tgz -C /tmp/eventbooth-src
          cat internal/eventbooth/rc4patch/part*.txt > /tmp/rc4.patch
          cd /tmp/eventbooth-src
          patch --batch -p1 < /tmp/rc4.patch
          cd "$GITHUB_WORKSPACE"
          python3 internal/eventbooth/rc4hotfix.py
          curl -L --fail --retry 3 --silent --show-error \
            'https://images.unsplash.com/photo-1503738692489-fff01e3e0f3e?auto=format&fit=crop&fm=jpg&q=82&w=2400' \
            -o /tmp/eventbooth-src/EventBooth/Resources/ScreenshotWedding.jpg
          test -s /tmp/eventbooth-src/EventBooth/Resources/ScreenshotWedding.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/eventbooth-src/EventBooth/App/EventBoothApp.swift')
          s=p.read_text()
          old='''        .task {
          await purchases.loadProducts()
          await purchases.refreshEntitlements()
        }'''
          new='''        .task {
          guard !EBScreenshotMode.isEnabled else { return }
          await purchases.loadProducts()
          await purchases.refreshEntitlements()
        }'''
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY

      - name: Build simulator app
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          cd /tmp/eventbooth-src
          xcodegen generate
          set -o pipefail
          xcodebuild -project EventBooth.xcodeproj -scheme EventBooth -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/eb-dd \
            CODE_SIGNING_ALLOWED=NO build | tee /tmp/eb-shots/build.log
          if grep -E '/tmp/eventbooth-src/EventBooth/.*: warning:' /tmp/eb-shots/build.log; then
            echo "SOURCE_WARNING_GATE=FAIL"
            exit 31
          fi
          APP="$(find /tmp/eb-dd/Build/Products -path '*Debug-iphonesimulator/EventBooth.app' -type d -print -quit)"
          test -d "$APP"
          echo "SIM_APP=$APP" >> "$GITHUB_ENV"

      - name: Resolve simulators
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY' >/tmp/udids.env
          import json
          j=json.load(open('/tmp/devices.json'))
          ds=[d for arr in j['devices'].values() for d in arr if d.get('isAvailable')]
          phones=[d for d in ds if d['name'].startswith('iPhone')]
          pads=[d for d in ds if d['name'].startswith('iPad')]
          if not phones or not pads: raise SystemExit('Missing iPhone/iPad simulator')
          def pick(xs, preferred):
              for p in preferred:
                  for d in xs:
                      if d['name']==p: return d
              return xs[0]
          phone=pick(phones,['iPhone 16 Pro Max','iPhone 16 Plus','iPhone 16 Pro','iPhone 16e'])
          pad=pick(pads,['iPad Pro 13-inch (M4)','iPad Air 13-inch (M3)','iPad Air 11-inch (M3)'])
          print('IPHONE_UDID='+phone['udid'])
          print('IPAD_UDID='+pad['udid'])
          print('IPHONE_NAME='+phone['name'])
          print('IPAD_NAME='+pad['name'])
          PY
          cat /tmp/udids.env

      - name: Capture real RC4 screens
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/udids.env

          xcrun simctl boot "$IPHONE_UDID" || true
          sleep 18
          xcrun simctl install "$IPHONE_UDID" "$SIM_APP"
          for spec in \
            "events fr fr_FR iphone-events-fr.png" \
            "dashboard fr fr_FR iphone-dashboard-fr.png" \
            "library fr fr_FR iphone-library-fr.png" \
            "events en en_US iphone-events-en.png" \
            "dashboard en en_US iphone-dashboard-en.png" \
            "library en en_US iphone-library-en.png"; do
            set -- $spec
            route="$1"; lang="$2"; locale="$3"; out="$4"
            xcrun simctl terminate "$IPHONE_UDID" com.operatorx.eventbooth >/dev/null 2>&1 || true
            SIMCTL_CHILD_EVENTBOOTH_SCREEN="$route" \
              xcrun simctl launch "$IPHONE_UDID" com.operatorx.eventbooth \
              -AppleLanguages "($lang)" -AppleLocale "$locale" >/dev/null
            sleep 4
            xcrun simctl io "$IPHONE_UDID" screenshot "/tmp/eb-shots/$out"
          done
          xcrun simctl shutdown "$IPHONE_UDID" || true

          xcrun simctl boot "$IPAD_UDID" || true
          sleep 18
          xcrun simctl install "$IPAD_UDID" "$SIM_APP"
          for spec in \
            "booth fr fr_FR ipad-booth-fr.png" \
            "dashboard fr fr_FR ipad-dashboard-fr.png" \
            "guestbook fr fr_FR ipad-guestbook-fr.png" \
            "booth en en_US ipad-booth-en.png" \
            "dashboard en en_US ipad-dashboard-en.png" \
            "guestbook en en_US ipad-guestbook-en.png"; do
            set -- $spec
            route="$1"; lang="$2"; locale="$3"; out="$4"
            xcrun simctl terminate "$IPAD_UDID" com.operatorx.eventbooth >/dev/null 2>&1 || true
            SIMCTL_CHILD_EVENTBOOTH_SCREEN="$route" \
              xcrun simctl launch "$IPAD_UDID" com.operatorx.eventbooth \
              -AppleLanguages "($lang)" -AppleLocale "$locale" >/dev/null
            sleep 4
            xcrun simctl io "$IPAD_UDID" screenshot "/tmp/eb-shots/$out"
          done
          xcrun simctl shutdown "$IPAD_UDID" || true

          test "$(find /tmp/eb-shots -name '*.png' | wc -l | tr -d ' ')" -eq 12
          echo "RC4_REAL_SCREENSHOTS=PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EventBooth-RC4-real-screens
          path: |
            /tmp/eb-shots/*.png
            /tmp/eb-shots/build.log
          if-no-files-found: warn
          retention-days: 30
