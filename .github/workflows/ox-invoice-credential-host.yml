name: OX Invoice BLINK credential-host release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch containing OX Invoice source
        required: false
        default: ox-invoice-release
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: macos-26
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_IAPKIT_API_KEY: ${{ secrets.OX_INVOICE_IAPKIT_KEY }}
      EXPO_PUBLIC_APP_ENV: production
    steps:
      - name: Checkout OX Invoice source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'ox-invoice-release' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select proven Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE='/Applications/Xcode_26.4.1.app/Contents/Developer'
          test -d "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
      - name: Use existing OX Invoice EAS project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo 'EXPO_TOKEN missing in credential-host repository'; exit 20; }
          test -n "${EXPO_PUBLIC_IAPKIT_API_KEY:-}" || { echo 'OX_INVOICE_IAPKIT_KEY missing in credential-host repository'; exit 21; }
          export EAS_PROJECT_ID="a8ec463b-a530-41c9-af1f-c5499359f881"
          echo "EAS_PROJECT_ID=$EAS_PROJECT_ID" >> "$GITHUB_ENV"
          npx expo config --json > /tmp/ox-invoice-expo-config.json
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('/tmp/ox-invoice-expo-config.json','utf8'));
          const expected = 'a8ec463b-a530-41c9-af1f-c5499359f881';
          const actual = cfg?.extra?.eas?.projectId || '';
          if (actual !== expected) {
            console.error('EAS project ID mismatch:', actual || '<empty>');
            process.exit(22);
          }
          console.log('EAS project verified:', actual);
          NODE
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-ox-invoice.mjs
          node tests/run-core-tests.mjs
      - name: Check App Store Connect integration
        shell: bash
        run: |
          set +e
          echo "=== ASC INTEGRATION STATUS ==="
          npx --yes eas-cli@latest integrations:asc:status --json --non-interactive
          echo "ASC_STATUS_EXIT=$?"
          echo "=== SUBMIT STATUS ==="
          npx --yes eas-cli@latest submit:status --platform ios --profile production --json --non-interactive
          echo "SUBMIT_STATUS_EXIT=$?"
          exit 0
      - name: Build signed IPA locally with EAS managed credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes eas-cli@latest build --platform ios --profile production --local --non-interactive --output ./artifacts/OX-Invoice-1.0-build1.ipa
          test -f ./artifacts/OX-Invoice-1.0-build1.ipa
          shasum -a 256 ./artifacts/OX-Invoice-1.0-build1.ipa | tee ./artifacts/IPA_SHA256.txt
      - name: Preserve IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OX-Invoice-IPA
          path: |
            artifacts/OX-Invoice-1.0-build1.ipa
            artifacts/IPA_SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Submit exact IPA to App Store Connect with EAS
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest submit --platform ios --profile production --path ./artifacts/OX-Invoice-1.0-build1.ipa --non-interactive

