name: OX Invoice QA Temp

on:
  push:
    branches:
      - ox-invoice-release
    paths:
      - .github/workflows/ox-invoice-qa-temp.yml

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run qa
