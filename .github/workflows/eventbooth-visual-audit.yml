name: Event Booth RC3 visual audit

on:
  push:
    branches: [eventbooth-asc-internal]
    paths:
      - ".github/workflows/eventbooth-visual-audit.yml"

permissions:
  contents: read

jobs:
  visual:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact successful RC3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eventbooth-src /tmp/eb-dd /tmp/visual
          mkdir -p /tmp/eventbooth-src /tmp/visual
          cat internal/eventbooth/chunks/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/base.tgz
          tar -xzf /tmp/base.tgz -C /tmp/eventbooth-src
          cp internal/eventbooth/overrides/CameraController.swift /tmp/eventbooth-src/EventBooth/Services/CameraController.swift
          cat internal/eventbooth/rc2/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/rc2.tgz
          tar -xzf /tmp/rc2.tgz -C /tmp/eventbooth-src
          base64 -D < internal/eventbooth/rc3.patch.gz.b64 > /tmp/rc3.patch.gz
          echo "49a2f3ecc3b2e21c0b1e97bad5a90c68b9b96ca75bcad7ccb9edfd53644364f0  /tmp/rc3.patch.gz" | shasum -a 256 -c -
          gunzip -c /tmp/rc3.patch.gz > /tmp/rc3.patch
          cd /tmp/eventbooth-src
          patch --batch -p4 < /tmp/rc3.patch
          cd "$GITHUB_WORKSPACE"
          cp internal/eventbooth/overrides/AudioRecorderService.swift /tmp/eventbooth-src/EventBooth/Services/AudioRecorderService.swift

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/eventbooth-src/EventBooth/App/EventBoothApp.swift')
          s=p.read_text()
          old='''        .task {
          await purchases.loadProducts()
          await purchases.refreshEntitlements()
        }'''
          new='''        .task {
          guard !EBScreenshotMode.isEnabled else { return }
          await purchases.loadProducts()
          await purchases.refreshEntitlements()
        }'''
          if old not in s:
              raise SystemExit('EventBoothApp task block not found')
          p.write_text(s.replace(old,new))
          PY

          # Screenshot-only wedding cover; it is injected only into the debug visual-audit build.
          curl -L --fail --retry 3             'https://images.unsplash.com/photo-1768777273699-1f8ccd51aaff?auto=format&fit=crop&fm=jpg&q=88&w=2400'             -o /tmp/eventbooth-src/EventBooth/Resources/ScreenshotWedding.jpg

      - name: Build simulator app
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          cd /tmp/eventbooth-src
          xcodegen generate
          xcodebuild             -project EventBooth.xcodeproj             -scheme EventBooth             -configuration Debug             -destination 'generic/platform=iOS Simulator'             -derivedDataPath /tmp/eb-dd             CODE_SIGNING_ALLOWED=NO             build | tee /tmp/visual-build.log
          APP="$(find /tmp/eb-dd/Build/Products -path '*Debug-iphonesimulator/EventBooth.app' -type d -print -quit)"
          test -d "$APP"
          echo "SIM_APP=$APP" >> "$GITHUB_ENV"

      - name: Resolve simulators
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY' >/tmp/devices.env
          import json
          j=json.load(open('/tmp/devices.json'))
          ds=[d for a in j['devices'].values() for d in a if d.get('isAvailable')]
          phones=[d for d in ds if d['name'].startswith('iPhone')]
          pads=[d for d in ds if d['name'].startswith('iPad')]
          def pick(xs,names):
              for name in names:
                  for d in xs:
                      if d['name']==name:return d
              return xs[0]
          p=pick(phones,['iPhone 16 Pro Max','iPhone 16 Plus','iPhone 16 Pro'])
          i=pick(pads,['iPad Pro 13-inch (M4)','iPad Air 13-inch (M3)','iPad Pro 11-inch (M4)'])
          print('IPHONE='+p['udid'])
          print('IPAD='+i['udid'])
          PY
          cat /tmp/devices.env

      - name: Capture iPhone organizer screens
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/devices.env
          xcrun simctl boot "$IPHONE" || true
          xcrun simctl bootstatus "$IPHONE" -b
          xcrun simctl install "$IPHONE" "$SIM_APP"
          xcrun simctl ui "$IPHONE" appearance light || true

          capture () {
            route="$1"
            out="$2"
            xcrun simctl terminate "$IPHONE" com.operatorx.eventbooth >/dev/null 2>&1 || true
            SIMCTL_CHILD_EVENTBOOTH_SCREEN="$route"               xcrun simctl launch "$IPHONE" com.operatorx.eventbooth               -AppleLanguages '(en)' -AppleLocale en_US >/dev/null
            sleep 4
            xcrun simctl io "$IPHONE" screenshot "/tmp/visual/$out"
          }

          capture events iphone-events.png
          capture dashboard iphone-dashboard.png
          capture library iphone-library.png
          capture settings iphone-settings.png
          xcrun simctl shutdown "$IPHONE"

      - name: Capture iPad Booth screens
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/devices.env
          xcrun simctl boot "$IPAD" || true
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl install "$IPAD" "$SIM_APP"
          xcrun simctl ui "$IPAD" appearance light || true

          capture () {
            route="$1"
            out="$2"
            xcrun simctl terminate "$IPAD" com.operatorx.eventbooth >/dev/null 2>&1 || true
            SIMCTL_CHILD_EVENTBOOTH_SCREEN="$route"               xcrun simctl launch "$IPAD" com.operatorx.eventbooth               -AppleLanguages '(en)' -AppleLocale en_US >/dev/null
            sleep 4
            xcrun simctl io "$IPAD" screenshot "/tmp/visual/$out"
          }

          capture booth ipad-booth.png
          capture dashboard ipad-dashboard.png
          capture library ipad-library.png
          capture guestbook ipad-guestbook.png
          capture voice ipad-voice.png
          capture export ipad-export.png
          capture eventSettings ipad-event-settings.png
          xcrun simctl shutdown "$IPAD"

          python3 - <<'PY'
          from PIL import Image
          import glob, os
          for p in sorted(glob.glob('/tmp/visual/*.png')):
              im=Image.open(p)
              print(os.path.basename(p), im.size)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EventBooth-RC3-visual-audit
          path: |
            /tmp/visual/*.png
            /tmp/visual-build.log
          if-no-files-found: warn
          retention-days: 30
