name: Event Booth signed archive

on:
  push:
    branches: [eventbooth-asc-internal]
    paths:
      - ".github/workflows/eventbooth-signed-archive.yml"

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      OX_EAS_PROJECT_ID: "a8ec463b-a530-41c9-af1f-c5499359f881"
      OX_PROJECT_SLUG: "ox-invoice"
      OX_BUNDLE_ID: "com.operatorx.oxinvoice"
      EVENTBOOTH_BUNDLE_ID: "com.operatorx.eventbooth"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Reconstruct Event Booth source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eventbooth-src
          cat internal/eventbooth/chunks/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/eventbooth-src.tar.gz
          echo "8a8d2094865775cdd5f1f6b302d527fbd2fda02008bed437706451fb83ee9cd2  /tmp/eventbooth-src.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/eventbooth-src.tar.gz -C /tmp/eventbooth-src
          cp internal/eventbooth/overrides/CameraController.swift /tmp/eventbooth-src/EventBooth/Services/CameraController.swift
      - name: Install tooling
        run: |
          brew install xcodegen
          mkdir -p /tmp/easlib
          npm install --prefix /tmp/easlib eas-cli@latest --ignore-scripts --no-audit --no-fund >/dev/null
      - name: Resolve Apple signing key from EAS
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/resolve-key.cjs <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const E='/tmp/easlib/node_modules/eas-cli/build';
          const { createGraphqlClient }=require(E+'/commandUtils/context/contextUtils/createGraphqlClient.js');
          const { getOwnerAccountForProjectIdAsync }=require(E+'/project/projectUtils.js');
          const { getAscApiKeyForAppSubmissionsAsync }=require(E+'/credentials/ios/api/GraphqlClient.js');
          const { AppStoreConnectApiKeyQuery }=require(E+'/graphql/queries/AppStoreConnectApiKeyQuery.js');
          const b64url=x=>Buffer.from(x).toString('base64url');
          function jwtFor(k){const n=Math.floor(Date.now()/1000),h={alg:'ES256',kid:k.keyIdentifier,typ:'JWT'},p={iss:k.issuerIdentifier,iat:n-5,exp:n+900,aud:'appstoreconnect-v1'};const si=b64url(JSON.stringify(h))+'.'+b64url(JSON.stringify(p));return si+'.'+crypto.sign('sha256',Buffer.from(si),{key:k.keyP8,dsaEncoding:'ieee-p1363'}).toString('base64url')}
          (async()=>{
            const gql=createGraphqlClient({accessToken:process.env.EXPO_TOKEN,sessionSecret:null});
            const account=await getOwnerAccountForProjectIdAsync(gql,process.env.OX_EAS_PROJECT_ID);
            const f=await getAscApiKeyForAppSubmissionsAsync(gql,{account,projectName:process.env.OX_PROJECT_SLUG,bundleIdentifier:process.env.OX_BUNDLE_ID});
            if(!f) throw new Error('ASC key missing');
            const k=await AppStoreConnectApiKeyQuery.getByIdAsync(gql,f.id);
            if(!k?.keyP8||!k?.keyIdentifier||!k?.issuerIdentifier) throw new Error('ASC key incomplete');
            fs.writeFileSync('/tmp/AuthKey.p8',k.keyP8,{mode:0o600});
            const token=jwtFor(k);
            const bid=encodeURIComponent(process.env.EVENTBOOTH_BUNDLE_ID);
            const r=await fetch('https://api.appstoreconnect.apple.com/v1/bundleIds?filter%5Bidentifier%5D='+bid+'&fields%5BbundleIds%5D=identifier,name,platform,seedId',{headers:{Authorization:'Bearer '+token}});
            const j=await r.json();
            if(!r.ok||!j.data?.length) throw new Error('Event Booth bundle id not found');
            const seed=j.data[0].attributes?.seedId;
            if(!seed) throw new Error('Team/seed ID missing');
            fs.appendFileSync(process.env.GITHUB_ENV,'ASC_KEY_ID='+k.keyIdentifier+'\nASC_ISSUER_ID='+k.issuerIdentifier+'\nAPPLE_TEAM_ID='+seed+'\n');
            console.log('ASC_KEY_RESOLVED=yes');
            console.log('APPLE_TEAM_ID_RESOLVED=yes');
          })().catch(e=>{console.error(e.message);process.exit(1)})
          NODE
          node /tmp/resolve-key.cjs
      - name: Generate project
        working-directory: /tmp/eventbooth-src
        run: xcodegen generate
      - name: Release simulator gate
        working-directory: /tmp/eventbooth-src
        run: xcodebuild -project EventBooth.xcodeproj -scheme EventBooth -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Signed archive
        working-directory: /tmp/eventbooth-src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild \
            -project EventBooth.xcodeproj \
            -scheme EventBooth \
            -configuration Release \
            -archivePath artifacts/EventBooth.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tee /tmp/eventbooth-archive.log
      - name: Export IPA
        working-directory: /tmp/eventbooth-src
        shell: bash
        run: |
          cat > artifacts/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath artifacts/EventBooth.xcarchive \
            -exportPath artifacts/export \
            -exportOptionsPlist artifacts/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee /tmp/eventbooth-export.log
          test -s artifacts/export/*.ipa
          shasum -a 256 artifacts/export/*.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EventBooth-signed-archive
          path: |
            /tmp/eventbooth-archive.log
            /tmp/eventbooth-export.log
            /tmp/eventbooth-src/artifacts/export/*.ipa
          if-no-files-found: warn
          retention-days: 7
