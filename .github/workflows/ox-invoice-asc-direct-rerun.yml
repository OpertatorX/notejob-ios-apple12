name: OX Invoice — ASC direct rerun

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ox-invoice-asc-direct-rerun.yml"
      - "scripts/ox_patch_extracted_asc.py"

permissions:
  contents: read

jobs:
  rerun-fixed-direct-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      OX_EAS_PROJECT_ID: "a8ec463b-a530-41c9-af1f-c5499359f881"
      OX_PROJECT_SLUG: "ox-invoice"
      OX_BUNDLE_ID: "com.operatorx.oxinvoice"
      OX_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install EAS CLI library
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "EXPO_TOKEN missing"; exit 20; }
          mkdir -p /tmp/easlib
          npm install --prefix /tmp/easlib eas-cli@latest --ignore-scripts --no-audit --no-fund >/dev/null

      - name: Prepare fixed one-off ASC script
        shell: bash
        run: python scripts/ox_patch_extracted_asc.py

      - name: Fix build/content rights and audit live ASC
        shell: bash
        run: node /tmp/asc-direct-fix.cjs
