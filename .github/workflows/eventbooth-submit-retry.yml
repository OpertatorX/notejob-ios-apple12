name: Event Booth retry EAS submit
on:
  push:
    branches: [eventbooth-asc-internal]
    paths:
      - ".github/workflows/eventbooth-submit-retry.yml"
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Prepare Event Booth EAS context
        run: |
          set -euo pipefail
          mkdir -p /tmp/eventbooth-eas
          cd /tmp/eventbooth-eas
          cat > app.json <<'JSON'
          {"expo":{"name":"Event Booth","slug":"eventbooth","owner":"operatorx","version":"1.0.0","ios":{"bundleIdentifier":"com.operatorx.eventbooth","buildNumber":"2","supportsTablet":true},"extra":{"eas":{"projectId":"9753c8e1-2a24-412c-af5a-adb6c10ec789"}}}}
          JSON
          cat > package.json <<'JSON'
          {"name":"eventbooth-eas-retry","version":"1.0.0","private":true}
          JSON
      - name: Retry submission
        working-directory: /tmp/eventbooth-eas
        run: |
          set -o pipefail
          npx --yes eas-cli@latest submit:retry 60a5a720-53a5-4f15-a644-ffe33916a754 --non-interactive --json | tee /tmp/eventbooth-submit-retry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventbooth-submit-retry
          path: /tmp/eventbooth-submit-retry.json
          if-no-files-found: ignore
          retention-days: 7
