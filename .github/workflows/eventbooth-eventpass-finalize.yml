name: Event Booth Event Pass finalize
on:
  push:
    branches: [eventbooth-asc-internal]
    paths: [".github/workflows/eventbooth-eventpass-finalize.yml"]
permissions: { contents: read }
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      OX_EAS_PROJECT_ID: "a8ec463b-a530-41c9-af1f-c5499359f881"
      OX_PROJECT_SLUG: "ox-invoice"
      OX_BUNDLE_ID: "com.operatorx.oxinvoice"
      IAP_ID: "6818428224"
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: |
          set -euo pipefail
          mkdir -p /tmp/easlib
          npm install --prefix /tmp/easlib eas-cli@latest --ignore-scripts --no-audit --no-fund >/dev/null
      - name: Diagnose and finalize Event Pass
        run: |
          set -euo pipefail
          cat >/tmp/finalize.cjs <<'NODE'
          const crypto=require('crypto');
          const E='/tmp/easlib/node_modules/eas-cli/build';
          const {createGraphqlClient}=require(E+'/commandUtils/context/contextUtils/createGraphqlClient.js');
          const {getOwnerAccountForProjectIdAsync}=require(E+'/project/projectUtils.js');
          const {getAscApiKeyForAppSubmissionsAsync}=require(E+'/credentials/ios/api/GraphqlClient.js');
          const {AppStoreConnectApiKeyQuery}=require(E+'/graphql/queries/AppStoreConnectApiKeyQuery.js');
          const b64url=x=>Buffer.from(x).toString('base64url');
          function jwtFor(k){const n=Math.floor(Date.now()/1000),h={alg:'ES256',kid:k.keyIdentifier,typ:'JWT'},p={iss:k.issuerIdentifier,iat:n-5,exp:n+900,aud:'appstoreconnect-v1'};const s=b64url(JSON.stringify(h))+'.'+b64url(JSON.stringify(p));return s+'.'+crypto.sign('sha256',Buffer.from(s),{key:k.keyP8,dsaEncoding:'ieee-p1363'}).toString('base64url')}
          async function req(tok,m,u,b=null,ok=[200]){
            const r=await fetch('https://api.appstoreconnect.apple.com'+u,{method:m,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
            const t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch{}
            console.log('HTTP='+r.status+'|'+m+'|'+u);
            if(!ok.includes(r.status)){console.log('ERROR='+JSON.stringify(j));return{status:r.status,data:j}}
            return{status:r.status,data:j}
          }
          (async()=>{
            const gql=createGraphqlClient({accessToken:process.env.EXPO_TOKEN,sessionSecret:null});
            const account=await getOwnerAccountForProjectIdAsync(gql,process.env.OX_EAS_PROJECT_ID);
            const frag=await getAscApiKeyForAppSubmissionsAsync(gql,{account,projectName:process.env.OX_PROJECT_SLUG,bundleIdentifier:process.env.OX_BUNDLE_ID});
            const key=await AppStoreConnectApiKeyQuery.getByIdAsync(gql,frag.id),tok=jwtFor(key);
            const id=process.env.IAP_ID;
            const iap=await req(tok,'GET','/v2/inAppPurchases/'+id+'?include=versions,inAppPurchaseAvailability&fields%5BinAppPurchases%5D=name,productId,state,reviewNote,familySharable,versions,inAppPurchaseAvailability&fields%5BinAppPurchaseVersions%5D=version,state&fields%5BinAppPurchaseAvailabilities%5D=availableInNewTerritories');
            console.log('BEFORE='+JSON.stringify(iap.data?.data?.attributes||{}));
            const versions=(iap.data?.included||[]).filter(x=>x.type==='inAppPurchaseVersions');
            for(const v of versions){
              const loc=await req(tok,'GET','/v1/inAppPurchaseVersions/'+v.id+'/localizations?fields%5BinAppPurchaseLocalizations%5D=locale,name,description&limit=50');
              console.log('VERSION='+v.id+'|'+JSON.stringify(v.attributes)+'|LOCS='+JSON.stringify((loc.data?.data||[]).map(x=>x.attributes)));
            }
            const av=await req(tok,'GET','/v2/inAppPurchases/'+id+'/inAppPurchaseAvailability?fields%5BinAppPurchaseAvailabilities%5D=availableInNewTerritories');
            console.log('AVAIL='+JSON.stringify(av.data?.data?.attributes||{}));
            const ps=await req(tok,'GET','/v2/inAppPurchases/'+id+'/iapPriceSchedule?include=baseTerritory,manualPrices&fields%5BinAppPurchasePriceSchedules%5D=baseTerritory,manualPrices&fields%5Bterritories%5D=currency&fields%5BinAppPurchasePrices%5D=startDate,endDate,territory,inAppPurchasePricePoint');
            console.log('PRICE_SCHEDULE='+JSON.stringify(ps.data));
            const shot=await req(tok,'GET','/v2/inAppPurchases/'+id+'/appStoreReviewScreenshot?fields%5BinAppPurchaseAppStoreReviewScreenshots%5D=fileName,assetDeliveryState');
            console.log('SHOT='+JSON.stringify(shot.data?.data?.attributes||{}));

            // Ask Apple to create the IAP submission. If metadata is incomplete,
            // the API validation error identifies the exact remaining field.
            const sub=await req(tok,'POST','/v1/inAppPurchaseSubmissions',{data:{type:'inAppPurchaseSubmissions',relationships:{inAppPurchaseV2:{data:{type:'inAppPurchases',id}}}}},[201]);
            if(sub.status===201){
              console.log('IAP_SUBMISSION_CREATED=yes');
              console.log('IAP_SUBMISSION_ID='+sub.data.data.id);
            } else {
              console.log('IAP_SUBMISSION_CREATED=no');
            }
            const after=await req(tok,'GET','/v2/inAppPurchases/'+id+'?fields%5BinAppPurchases%5D=name,productId,state,reviewNote,familySharable');
            console.log('AFTER='+JSON.stringify(after.data?.data?.attributes||{}));
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)})
          NODE
          node /tmp/finalize.cjs
