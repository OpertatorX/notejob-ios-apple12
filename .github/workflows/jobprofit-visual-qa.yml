name: JobProfit Native Visual QA

on:
  push:
    branches:
      - jobprofit-preview
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native sources
        shell: bash
        run: |
          set -euo pipefail
          test -f jobprofit-native/project.yml
          test -f jobprofit-native/JobProfit/JobProfitApp.swift
          test -f jobprofit-native/JobProfit/VisualQARoot.swift
          find jobprofit-native -maxdepth 2 -type f | sort

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: jobprofit-native
        run: xcodegen generate

      - name: Build native app
        working-directory: jobprofit-native
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project JobProfit.xcodeproj \
            -scheme JobProfit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Select and boot simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          preferred=[]
          fallback=[]
          for _, devices in data["devices"].items():
              for d in devices:
                  if d.get("isAvailable"):
                      if d["name"] == "iPhone 16 Pro":
                          preferred.append(d["udid"])
                      elif d["name"].startswith("iPhone"):
                          fallback.append(d["udid"])
          candidates=preferred or fallback
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          print(candidates[0])
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          BOOTED=0
          for i in $(seq 1 60); do
            STATE=$(xcrun simctl list devices -j | python3 -c 'import json,sys; d=json.load(sys.stdin); u=sys.argv[1]; print(next((x.get("state","") for xs in d["devices"].values() for x in xs if x.get("udid")==u),""))' "$UDID")
            echo "Simulator state: $STATE"
            if [ "$STATE" = "Booted" ]; then BOOTED=1; break; fi
            sleep 2
          done
          if [ "$BOOTED" != "1" ]; then
            echo "Simulator failed to boot within 120 seconds"
            xcrun simctl list devices
            exit 31
          fi

      - name: Install app
        working-directory: jobprofit-native
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Debug-iphonesimulator/JobProfit.app"
          test -d "$APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"

      - name: Capture real SwiftUI screens
        working-directory: jobprofit-native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          for SCREEN in overview jobs detail compare addCost activity insights jobTypes settings; do
            xcrun simctl terminate "${{ steps.sim.outputs.udid }}" com.operatorx.jobprofit || true
            xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.operatorx.jobprofit --visual-qa "$SCREEN"
            sleep 2
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "screenshots/$SCREEN.png"
          done
          ls -lh screenshots

      - name: Upload screenshots and build log
        uses: actions/upload-artifact@v4
        with:
          name: jobprofit-native-visual-qa
          path: |
            jobprofit-native/screenshots/*.png
            jobprofit-native/xcodebuild.log
          if-no-files-found: error
