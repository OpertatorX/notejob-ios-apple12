name: Event Booth final hotfix validate
on:
  push:
    branches: [eventbooth-asc-internal]
    paths: [".github/workflows/eventbooth-final-hotfix-validate.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct RC8 and apply final hotfix
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/eventbooth-src
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cat internal/eventbooth/chunks/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/base.tgz
          tar -xzf /tmp/base.tgz -C "$ROOT"
          cp internal/eventbooth/overrides/CameraController.swift "$ROOT/EventBooth/Services/CameraController.swift"
          cat internal/eventbooth/rc2/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/rc2.tgz
          tar -xzf /tmp/rc2.tgz -C "$ROOT"
          cat internal/eventbooth/rc4patch/part*.txt > /tmp/rc4.patch
          (cd "$ROOT" && patch --batch -p1 < /tmp/rc4.patch)
          python3 internal/eventbooth/rc4hotfix.py
          for n in 5 6 7; do
            (cd "$ROOT" && patch --batch -p1 < "$GITHUB_WORKSPACE/internal/eventbooth/rc$n.patch")
          done
          python3 internal/eventbooth/rc8hotfix.py
          python3 internal/eventbooth/finalhotfix.py
          ICON="$ROOT/EventBooth/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          BRAND="$ROOT/EventBooth/Resources/Assets.xcassets/BrandMark.imageset/BrandMark.png"
          file "$ICON"
          python3 - "$ICON" <<'PY'
          import sys, struct, zlib
          p=sys.argv[1]
          data=open(p,'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          pos=8; idat=[]; width=height=None; saw_iend=False
          while pos + 12 <= len(data):
              n=struct.unpack('>I',data[pos:pos+4])[0]
              typ=data[pos+4:pos+8]
              end=pos+12+n
              assert end <= len(data), (typ,n,end,len(data))
              payload=data[pos+8:pos+8+n]
              expected=struct.unpack('>I',data[pos+8+n:end])[0]
              actual=zlib.crc32(typ+payload)&0xffffffff
              assert expected == actual, (typ,expected,actual)
              if typ == b'IHDR':
                  width,height=struct.unpack('>II',payload[:8])
              elif typ == b'IDAT':
                  idat.append(payload)
              elif typ == b'IEND':
                  saw_iend=True
                  pos=end
                  break
              pos=end
          assert saw_iend and pos == len(data), (saw_iend,pos,len(data))
          assert (width,height) == (1024,1024), (width,height)
          zlib.decompress(b''.join(idat))
          print(f'PNG_DECODE=PASS|{width}x{height}|bytes={len(data)}')
          PY
          SHA="$(sha256sum "$ICON" | awk '{print $1}')"
          echo "ACTUAL_ICON_SHA=$SHA"
          cmp "$ICON" "$BRAND"
          grep -q 'CURRENT_PROJECT_VERSION: 11' "$ROOT/project.yml"
          grep -q 'Image("BrandMark")' "$ROOT/EventBooth/Features/Booth/BoothHomeView.swift"
          grep -q 'Image("BrandMark")' "$ROOT/EventBooth/Features/Events/EventsHomeView.swift"
          mkdir -p /tmp/eventbooth-brand-audit
          cp "$ICON" /tmp/eventbooth-brand-audit/AppIcon-1024.png
          cp "$BRAND" /tmp/eventbooth-brand-audit/BrandMark.png
          echo "APPICON_SHA256=$SHA"
          echo "APPICON_SIZE=1024x1024"
          echo "BRANDMARK_MATCHES_ICON=yes"
          echo "BUILD_NUMBER=11"
          echo "EVENTBOOTH_FINAL_HOTFIX_VALIDATE=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: EventBooth-final-brand-audit
          path: /tmp/eventbooth-brand-audit
          retention-days: 7
