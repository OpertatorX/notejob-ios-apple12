name: Event Booth final hotfix validate
on:
  push:
    branches: [eventbooth-asc-internal]
    paths: [".github/workflows/eventbooth-final-hotfix-validate.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct RC8 and apply final hotfix
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/eventbooth-src
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cat internal/eventbooth/chunks/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/base.tgz
          tar -xzf /tmp/base.tgz -C "$ROOT"
          cp internal/eventbooth/overrides/CameraController.swift "$ROOT/EventBooth/Services/CameraController.swift"
          cat internal/eventbooth/rc2/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/rc2.tgz
          tar -xzf /tmp/rc2.tgz -C "$ROOT"
          cat internal/eventbooth/rc4patch/part*.txt > /tmp/rc4.patch
          (cd "$ROOT" && patch --batch -p1 < /tmp/rc4.patch)
          python3 internal/eventbooth/rc4hotfix.py
          for n in 5 6 7; do
            (cd "$ROOT" && patch --batch -p1 < "$GITHUB_WORKSPACE/internal/eventbooth/rc$n.patch")
          done
          python3 internal/eventbooth/rc8hotfix.py
          python3 internal/eventbooth/finalhotfix.py
          file "$ROOT/EventBooth/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          p=Path('/tmp/eventbooth-src/EventBooth/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png')
          im=Image.open(p)
          assert im.size==(1024,1024), im.size
          assert im.mode in ('RGB','RGBA'), im.mode
          print('APPICON_SIZE=1024x1024')
          print('APPICON_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          q=Path('/tmp/eventbooth-src/EventBooth/Resources/Assets.xcassets/BrandMark.imageset/BrandMark.png')
          assert q.read_bytes()==p.read_bytes()
          print('BRANDMARK_MATCHES_APPROVED_ICON=yes')
          project=Path('/tmp/eventbooth-src/project.yml').read_text()
          assert 'CURRENT_PROJECT_VERSION: 11' in project
          print('BUILD_NUMBER=11')
          PY
          grep -q 'Image("BrandMark")' "$ROOT/EventBooth/Features/Booth/BoothHomeView.swift"
          grep -q 'Image("BrandMark")' "$ROOT/EventBooth/Features/Events/EventsHomeView.swift"
          echo "EVENTBOOTH_FINAL_HOTFIX_VALIDATE=PASS"
