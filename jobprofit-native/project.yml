name: JobProfit
options:
  bundleIdPrefix: com.operatorx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  JobProfit:
    type: application
    platform: iOS
    sources:
      - path: JobProfit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operatorx.jobprofit
        INFOPLIST_FILE: JobProfit/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
